[package]
name = "photocraft-cli"
description = "Headless PhotoCraft: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["local-ai", "osor"]
# Native Rust CPU inference; weights are optional downloads, never embedded.
local-ai = ["photocraft-engine/native-inference"]
# Native OSOR support; model weights remain separate, explicit downloads or local imports.
osor = ["photocraft-engine/osor", "photocraft-ml/osor"]
osor-metal = ["osor", "photocraft-engine/osor-metal", "photocraft-ml/osor-metal"]
# Open HEIC/HEIF photos (the optional photocraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]

[lints]
workspace = true

[lib]
name = "photocraft_cli"
path = "src/lib.rs"

[[bin]]
name = "photocraft-cli"
path = "src/main.rs"

[dependencies]
photocraft-ml = { workspace = true }
# HTTPS model streams, pinned to the already-used Rust TLS client.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
photocraft-automation = { path = "../../crates/automation" }
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-format = { path = "../../crates/format" }
photocraft-codecs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Synthetic camera raws (#7789).
photocraft-raw = { workspace = true, features = ["testgen"] }
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in
# the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for photocraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

