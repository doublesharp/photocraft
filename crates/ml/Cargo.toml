[package]
name = "photocraft-ml"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
native-inference = ["dep:tract-onnx"]
osor = ["dep:osor-rs", "dep:serde_json"]
osor-metal = ["osor", "osor-rs/metal"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "=0.10.9"
serde_json = { workspace = true, optional = true }
tempfile = "3"
tract-onnx = { version = "=0.23.9", optional = true }

# Select Metal only on macOS; other native defaults retain CPU support.
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
osor-rs = { git = "https://github.com/doublesharp/osor-rs", rev = "1b299a1d4bcfc15e10e81a4ba766d479ce8e27ed", optional = true, features = ["metal"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
osor-rs = { git = "https://github.com/doublesharp/osor-rs", rev = "1b299a1d4bcfc15e10e81a4ba766d479ce8e27ed", optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cap-std = "=4.0.3"
cap-primitives = "=4.0.3"
getrandom = "=0.3.4"
same-file = "=1.0.6"

# Immutable source qualified with the native integration; see README before updating.
[package.metadata.osor-development]
tested-source-revision = "1b299a1d4bcfc15e10e81a4ba766d479ce8e27ed"
